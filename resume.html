<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resume · Aditya Dixit</title>
  <meta name="description" content="Resume page for Aditya Dixit." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a href="/" class="logo">aditya<span class="logo-kiwi">.kiwi</span></a>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/resume.html" aria-current="page">Resume</a></li>
      </ul>
      <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </nav>
  </header>

  <main class="section">
    <div class="container">
      <h1 class="section-title">Resume</h1>
      <p class="contact-text">Embedded Google Doc version of my resume.</p>
      <p class="contact-text">
        If the embed does not load, open it directly:
        <a href="https://docs.google.com/document/d/1rHbs2IAb6PIX2VU8KmDwjcn98vWLpDRbY7W3pXLBNvE/edit?usp=sharing" target="_blank" rel="noopener">
          Google Doc Resume
        </a>
      </p>
      <div class="resume-embed-wrap">
        <iframe
          class="resume-embed"
          title="Aditya Dixit Resume"
          src="https://docs.google.com/document/d/1rHbs2IAb6PIX2VU8KmDwjcn98vWLpDRbY7W3pXLBNvE/preview"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
          allowfullscreen>
        </iframe>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year"></span> Aditya Dixit · aditya.kiwi</p>
    </div>
  </footer>

  <script>
    (function () {
      var yearEl = document.getElementById("year");
      if (yearEl) yearEl.textContent = new Date().getFullYear();

      var toggle = document.querySelector(".nav-toggle");
      var links = document.querySelector(".nav-links");
      if (toggle && links) {
        toggle.addEventListener("click", function () {
          var open = links.classList.toggle("is-open");
          toggle.setAttribute("aria-expanded", open);
        });
      }
    })();
  </script>
</body>
</html>
